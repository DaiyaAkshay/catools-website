<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="CAtool">
  <defs>
    <linearGradient id="ctbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <clipPath id="sq-mark"><rect width="64" height="64" rx="14"/></clipPath>
    <mask id="jaw-mark" maskUnits="userSpaceOnUse">
      <rect x="0" y="0" width="64" height="64" fill="#fff"/>
      <rect x="1"    y="49" width="10.5" height="6" rx="1" fill="#000"/>
      <rect x="52.5" y="49" width="10.5" height="6" rx="1" fill="#000"/>
    </mask>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#ctbg)"/>
  <!-- big CA, lifted clear of the spanner -->
  <text x="32" y="42" text-anchor="middle"
        font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"
        font-weight="800" font-size="42" fill="#ffffff" letter-spacing="-2">CA</text>
  <!-- long, thick, gently waisted double open-ended spanner -->
  <g fill="#34d399" mask="url(#jaw-mark)" clip-path="url(#sq-mark)">
    <path d="M11 48 Q32 49.6 53 48 L53 56 Q32 54.4 11 56 Z"/>
    <circle cx="11" cy="52" r="8"/>
    <circle cx="53" cy="52" r="8"/>
  </g>
</svg>
